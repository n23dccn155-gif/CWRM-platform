      operationId: createManagerIntervention
      tags: [Progress]
      summary: Can thiệp quản lý có lý do
      description: 'Quyền WORKSPACE_MANAGER; Manager không phải R điều chỉnh progress hoặc effort thay R (Scope 6.3). Task phải IN_PROGRESS hoặc BLOCKED; reason bắt buộc và lưu audit trước/sau. Response gồm `{ intervention, task }`; `intervention` được dựng từ audit record. Không đặt task status hay risk; deadline và priority sửa qua PATCH /tasks/{taskId}.'
      x-permission: WORKSPACE_MANAGER
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ManagerInterventionRequest'}}}}
      responses:
        '200': {description: Bản ghi can thiệp và Task sau cập nhật, content: {application/json: {schema: {$ref: '#/components/schemas/ManagerInterventionResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /tasks/{taskId}/blockers:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
    get:
      operationId: listBlockers
      tags: [Progress]
      summary: Liệt kê blocker
      description: Quyền TASK_ACCESS.
      x-permission: TASK_ACCESS
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Blocker phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/BlockerPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    post:
      operationId: createBlocker
      tags: [Progress]
      summary: Báo blocker
      description: Quyền TASK_RESPONSIBLE; task IN_PROGRESS/BLOCKED. Khi có blocker mở, hệ thống chuyển task BLOCKED và mở blocked period nếu cần.
      x-permission: TASK_RESPONSIBLE
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BlockerCreateRequest'}}}}
      responses:
        '201': {description: Blocker và task hiện hành, content: {application/json: {schema: {$ref: '#/components/schemas/BlockerResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /blockers/{blockerId}/resolve:
    parameters:
      - {$ref: '#/components/parameters/BlockerId'}
    post:
      operationId: resolveBlocker
      tags: [Progress]
      summary: Giải quyết blocker
      description: Quyền TASK_RESPONSIBLE hoặc WORKSPACE_MANAGER; ghi chú xử lý bắt buộc. Task chỉ về IN_PROGRESS khi mọi blocker đã Resolved.
      x-permission: [TASK_RESPONSIBLE, WORKSPACE_MANAGER]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResolveBlockerRequest'}}}}
      responses:
        '200': {description: Blocker đã giải quyết, content: {application/json: {schema: {$ref: '#/components/schemas/BlockerResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /tasks/{taskId}/comments:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
    get:
      operationId: listTaskComments
      tags: [Progress]
      summary: Xem trao đổi task
      description: Quyền TASK_ACCESS.
      x-permission: TASK_ACCESS
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Comment phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/CommentPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    post:
      operationId: createTaskComment
      tags: [Progress]
      summary: Bình luận trên task
      description: Quyền TASK_ACCESS; MANAGER của workspace hoặc thành viên team được trao đổi. Không có chat realtime.
      x-permission: TASK_ACCESS
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommentCreateRequest'}}}}
      responses:
        '201': {description: Comment, content: {application/json: {schema: {$ref: '#/components/schemas/TaskComment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /tasks/{taskId}/dependencies:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
    get:
      operationId: listTaskDependencies
      tags: [Task]
      summary: Xem predecessor và successor
      description: Quyền TASK_ACCESS; danh sách cạnh Finish-to-Start phân trang, có thể có nhiều predecessor/successor.
      x-permission: TASK_ACCESS
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Dependency edges phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/DependencyPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    post:
      operationId: addTaskDependency
      tags: [Task]
      summary: Thêm Finish-to-Start dependency
      description: Quyền WORKSPACE_MANAGER; cùng team, không tự phụ thuộc/không vòng; successor phải còn TO_DO. Dependency tự trỏ (predecessor trùng successor) được coi là vòng và trả 422 DEPENDENCY_CYCLE; khác team trả 422 CROSS_TEAM_DEPENDENCY.
      x-permission: WORKSPACE_MANAGER
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DependencyCreateRequest'}}}}
      responses:
        '201': {description: Dependency, content: {application/json: {schema: {$ref: '#/components/schemas/TaskDependency'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /dependencies/{dependencyId}/remove:
    parameters:
      - {$ref: '#/components/parameters/DependencyId'}
    post:
      operationId: removeTaskDependency
      tags: [Task]
      summary: Gỡ dependency
      description: Quyền WORKSPACE_MANAGER; chỉ sửa khi task phụ thuộc còn TO_DO; lưu audit và reason.
      x-permission: WORKSPACE_MANAGER
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
      responses:
        '204': {description: Dependency đã gỡ}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /tasks/{taskId}/risk-snapshots/current:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
    get:
      operationId: getCurrentTaskRisk
      tags: [Risk]
      summary: Xem risk snapshot hiện hành
      description: Quyền TASK_ACCESS; isCurrent=false khi dữ liệu task đã đổi sau snapshot hoặc lần đánh giá gần nhất lỗi, khi đó UI không trình bày snapshot như kết quả mới. Với MEMBER, evidence về workload chỉ có số tổng hợp, không kèm tên hay nội dung task ngoài quyền xem (Scope S10). Không ai nhập hoặc sửa risk bằng tay.
      x-permission: TASK_ACCESS
      responses:
        '200': {description: Snapshot gần nhất và trạng thái currentness, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentRisk'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /tasks/{taskId}/risk-snapshots:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
    get:
      operationId: listTaskRiskSnapshots
      tags: [Risk]
      summary: Xem lịch sử risk
      description: Quyền TASK_ACCESS; snapshot bất biến, phân trang.
      x-permission: TASK_ACCESS
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Lịch sử phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/RiskSnapshotPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    post:
      operationId: evaluateTaskRisk
      tags: [Risk]
      summary: Manager yêu cầu đánh giá lại
      description: Quyền WORKSPACE_MANAGER; nguồn trigger MANUAL. Không nhận riskLevel/risk score từ client.
      x-permission: WORKSPACE_MANAGER
      requestBody: {$ref: '#/components/requestBodies/EmptyOptional'}
      responses:
        '200': {description: Đánh giá thành công và snapshot mới, content: {application/json: {schema: {$ref: '#/components/schemas/RiskEvaluationResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/RiskInputInvalid'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        '503': {$ref: '#/components/responses/RiskUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /dashboard/manager:
    get:
      operationId: getManagerDashboard
      tags: [Dashboard]
      summary: Dashboard risk của Manager
      description: Quyền WORKSPACE_MANAGER; trả số task theo status và theo risk, kèm danh sách task theo bộ lọc team, status, priority, riskLevel, assignmentMode, openWorkOpen, deadlineBefore/deadlineAfter và người A/R. Khi không truyền riskLevel, danh sách gồm task chưa DONE có risk MEDIUM hoặc HIGH.
      x-permission: WORKSPACE_MANAGER
      parameters:
        - {$ref: '#/components/parameters/WorkspaceIdQuery'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: teamId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/TaskStatus'}}
        - {name: priority, in: query, schema: {$ref: '#/components/schemas/Priority'}}
        - {name: riskLevel, in: query, schema: {$ref: '#/components/schemas/RiskLevel'}}
        - {name: assignmentMode, in: query, schema: {type: string, enum: [DIRECT, OPEN_WORK]}}
        - {name: openWorkOpen, in: query, schema: {type: boolean}}
        - {name: accountableUserId, in: query, schema: {type: string, format: uuid}}
        - {name: responsibleUserId, in: query, schema: {type: string, format: uuid}}
        - {name: deadlineBefore, in: query, schema: {type: string, format: date-time}}
        - {name: deadlineAfter, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Dashboard phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/Dashboard'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /dashboard/my-work:
    get:
      operationId: getMyWorkDashboard
      tags: [Dashboard]
      summary: My Work
      description: Quyền WORKSPACE_MEMBER; trả riêng ba danh sách phân trang, gồm task chưa DONE mà người gọi là R hiệu lực, đề nghị Direct PENDING_ACCEPTANCE đang chờ người gọi, và request Open Work do người gọi gửi. `counts` là tổng số bản ghi của mỗi section trong workspace, không phụ thuộc trang hiện tại.
      x-permission: WORKSPACE_MEMBER
      parameters:
        - {$ref: '#/components/parameters/WorkspaceIdQuery'}
        - {name: myTasksPage, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: myTasksPageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: pendingDirectAssignmentsPage, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pendingDirectAssignmentsPageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: myOpenWorkRequestsPage, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: myOpenWorkRequestsPageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: My Work với từng section phân trang độc lập, content: {application/json: {schema: {$ref: '#/components/schemas/MyWorkDashboard'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /alerts:
    get:
      operationId: listMyAlerts
      tags: [Dashboard]
      summary: Liệt kê cảnh báo của tôi
      description: Quyền SELF; chỉ cảnh báo mà người gọi là người nhận, tức A hoặc R hiệu lực của task. Đã đọc không đồng nghĩa đã giải quyết.
      x-permission: SELF
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: workspaceId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [OPEN, RESOLVED]}}
        - {name: unread, in: query, schema: {type: boolean}}
      responses:
        '200': {description: Alert phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/AlertPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /alerts/{alertId}/read:
    parameters:
      - {$ref: '#/components/parameters/AlertId'}
    post:
      operationId: markAlertRead
      tags: [Dashboard]
      summary: Đánh dấu đã đọc
      description: Quyền SELF; người gọi phải là người nhận của cảnh báo. Cập nhật readAt của riêng người gọi, không resolve alert.
      x-permission: SELF
      responses:
        '200': {description: Trạng thái đọc của tôi, content: {application/json: {schema: {$ref: '#/components/schemas/AlertRecipient'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /tasks/{taskId}/risk-snapshots/{snapshotId}/explanations:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
      - {$ref: '#/components/parameters/SnapshotId'}
    get:
      operationId: getRiskExplanation
      tags: [AI]
      summary: Xem giải thích đã lưu của snapshot
      description: Quyền WORKSPACE_MANAGER; trả kết quả mới nhất đã lưu cho snapshot và không gọi AI. Trả 404 khi snapshot chưa có kết quả nào.
      x-permission: WORKSPACE_MANAGER
      responses:
        '200': {description: 'Kết quả đã lưu, SUCCESS hoặc FAILED', content: {application/json: {schema: {$ref: '#/components/schemas/AIExplanationResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    post:
      operationId: requestRiskExplanation
      tags: [AI]
      summary: Yêu cầu AI giải thích snapshot
      description: Quyền WORKSPACE_MANAGER; chỉ nhận snapshot hiện hành của task có mức MEDIUM hoặc HIGH (409 SNAPSHOT_NOT_CURRENT, 422 AI_SNAPSHOT_LEVEL_NOT_SUPPORTED). Nếu đã có kết quả SUCCESS cho snapshot tương đương thì trả lại kết quả đó với reused=true và không gọi AI. Sau khi provider hoàn tất, backend kiểm tra lại snapshot hiện hành trước khi lưu/trả; nếu dữ liệu task đã đổi thì recommendation vẫn gắn với snapshot gốc, response có `isCurrent=false` và kết quả không được gắn vào snapshot mới. Khi AI lỗi, backend lưu bản ghi FAILED rồi trả 502 hoặc 503 kèm `snapshotId` và `fallbackExplanation` dựng từ evidence đã lưu; risk và evidence không bị ảnh hưởng, Manager có thể gọi lại. Provider và model do CWRM-16 chốt, không thuộc ADR-001.
      x-permission: WORKSPACE_MANAGER
      requestBody: {$ref: '#/components/requestBodies/EmptyOptional'}
      responses:
        '200': {description: 'Kết quả SUCCESS, mới tạo hoặc tái sử dụng', content: {application/json: {schema: {$ref: '#/components/schemas/AIExplanationResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        '502': {$ref: '#/components/responses/AIGatewayError'}
        '503': {$ref: '#/components/responses/AIUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /ai-recommendations/{recommendationId}:
    parameters:
      - {$ref: '#/components/parameters/RecommendationId'}
    get:
      operationId: getAIRecommendation
      tags: [AI]
      summary: Xem recommendation đã lưu
      description: Quyền WORKSPACE_MANAGER; trả bản ghi đã lưu, SUCCESS hoặc FAILED, kèm isCurrent so với snapshot hiện hành của task.
      x-permission: WORKSPACE_MANAGER
      responses:
        '200': {description: Recommendation/fallback, content: {application/json: {schema: {$ref: '#/components/schemas/AIExplanationResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /tasks/{taskId}/history:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PageSize'}
    get:
      operationId: listTaskAuditHistory
      tags: [Audit]
      summary: Xem lịch sử task
      description: Quyền TASK_ACCESS; audit append-only, chỉ đọc.
      x-permission: TASK_ACCESS
      responses:
        '200': {description: Lịch sử phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/AuditPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkspaceId: {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
    WorkspaceIdQuery: {name: workspaceId, in: query, required: true, description: 'Workspace đang làm việc. Một tài khoản có thể thuộc nhiều workspace', schema: {type: string, format: uuid}}
    UserId: {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    TeamId: {name: teamId, in: path, required: true, schema: {type: string, format: uuid}}
    RoleId: {name: roleId, in: path, required: true, schema: {type: string, format: uuid}}
    SkillId: {name: skillId, in: path, required: true, schema: {type: string, format: uuid}}
    MilestoneId: {name: milestoneId, in: path, required: true, schema: {type: string, format: uuid}}
    TaskId: {name: taskId, in: path, required: true, schema: {type: string, format: uuid}}
    AssignmentId: {name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}
    RequestId: {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    BlockerId: {name: blockerId, in: path, required: true, schema: {type: string, format: uuid}}
    DependencyId: {name: dependencyId, in: path, required: true, schema: {type: string, format: uuid}}
    InvitationId: {name: invitationId, in: path, required: true, schema: {type: string, format: uuid}}
    SnapshotId: {name: snapshotId, in: path, required: true, schema: {type: string, format: uuid}}
    AlertId: {name: alertId, in: path, required: true, schema: {type: string, format: uuid}}
    RecommendationId: {name: recommendationId, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
