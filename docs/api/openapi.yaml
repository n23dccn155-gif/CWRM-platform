      description: Quyền SELF; chỉ tài khoản được mời mới được Accept, lời mời của người khác trả 404. Chỉ lời mời PENDING được Accept; lời mời đã ACCEPTED/DECLINED trả 422 INVALID_STATE_TRANSITION (kể cả lần Accept thứ hai) và không đổi dữ liệu. Accept tạo membership MEMBER ACTIVE, hoặc kích hoạt lại membership INACTIVE cũ với quyền MEMBER, cùng transaction với việc đóng lời mời và audit; không khôi phục team cũ (C33-01.2, C33-03.3).
      x-permission: SELF
      responses:
        '200': {description: Membership đã tham gia, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceMembership'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
