      tags: [Team]
      summary: Thêm thành viên vào team
      description: Quyền WORKSPACE_MANAGER; userId phải là thành viên ACTIVE của workspace chứa team, nếu không trả 400 VALIDATION_ERROR với details.fields.userId (C33-01.3). Người đã là thành viên ACTIVE của team trả 409 UNIQUE_CONFLICT. Thêm lại người từng rời team thì kích hoạt lại membership cũ với mainRoleId null; Manager đặt lại Main Role qua PATCH (C33-02.2).
      x-permission: WORKSPACE_MANAGER
