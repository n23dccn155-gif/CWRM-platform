    parameters:
      - {$ref: '#/components/parameters/AssignmentId'}
    patch:
      operationId: updateAssignmentRemainingEffort
      tags: [Assignment]
      summary: Cập nhật effort còn lại
      description: |
        R dùng quyền ASSIGNMENT_OWNER; Manager có thể cập nhật với reason bắt buộc. Giá trị 0 hợp lệ, null là chưa khai. expectedVersion bắt buộc; lưu audit và reevaluate các task R09 liên quan; không reset R13.
      x-permission: [ASSIGNMENT_OWNER, WORKSPACE_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
