          allOf:
            - {$ref: '#/components/schemas/RiskLevel'}
          description: Mức cơ sở thấp nhất của rule; R09 có thể cho HIGH khi tỷ lệ vượt 125%.
        boostable: {type: boolean, description: 'true khi rule có mức cơ sở MEDIUM và được nâng một lần lên HIGH nếu priority HIGH/CRITICAL, deadline FIXED hoặc affectedTaskCount >= 3. R09 và R13 luôn false; rule mức cơ sở HIGH cũng false.'}
        condition: {type: string}
        ruleVersion: {type: string}
