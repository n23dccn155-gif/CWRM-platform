      description: Quyền WORKSPACE_MANAGER; gỡ người đang là A của task chưa DONE thuộc team này trả 422 RESPONSIBILITY_REQUIRED (C33-02.3). Membership team chuyển INACTIVE, cùng transaction với audit, lịch sử được giữ. Guard R áp dụng khi module assignment có dữ liệu (WP-024A/B, WP-026).
      x-permission: WORKSPACE_MANAGER
      responses:
        '204': {description: Đã gỡ thành viên}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    patch:
      operationId: setTeamMemberMainRole
      tags: [Team]
      summary: Đặt Main Role cho thành viên team
      description: |
        Quyền WORKSPACE_MANAGER. Đặt mainRoleId thuộc cùng workspace cho membership của thành viên trong team này; gửi null để bỏ Main Role. expectedVersion là version membership. Thay đổi được ghi audit và không đổi assignment hiện có.
        Thứ tự kiểm (C33-03.2): quyền, rồi request (mainRoleId không thuộc workspace trả 400 VALIDATION_ERROR với details.fields.mainRoleId), rồi expectedVersion (version cũ trả 409 VERSION_CONFLICT kể cả khi payload giống hiện tại), sau cùng mới xét no-op. Gửi đúng Main Role đang có với version đúng là no-op: trả 200, giữ version, không ghi audit. Thay đổi thật tăng version đúng 1, cùng transaction với audit. Main Role không đổi quyền hệ thống, Task Role, assignment/RACI hay điều kiện Open Work.
