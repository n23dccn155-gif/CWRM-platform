        recipientLabels: {type: array, uniqueItems: true, items: {type: string, enum: [A, R, MANAGER]}, description: 'A và R cho alert theo task; MANAGER cho alert MILESTONE_CONFIRMATION.'}
        readAt: {type: string, format: date-time, nullable: true}
