        ruleId: {type: string, pattern: '^R(0[1-9]|1[0-2])$'}
        field:
          type: string
          description: >
            Tên field camelCase. Các field hiện dùng gồm deadlineAt, progress, remainingHours,
            overdueHours, priority, deadlineType, affectedTaskCount và các ngưỡng
            remainingHoursMinExclusive, remainingHoursMaxInclusive, progressMaxExclusive.
            Evidence ngưỡng dùng source=rule. Field và unit không bị khóa bằng enum;
            unit hiện dùng là hours và percent, giá trị khác bổ sung theo đặc tả R04–R12 của CWRM-15.
        value:
          anyOf:
            - {type: string, nullable: true}
            - {type: number, nullable: true}
            - {type: boolean, nullable: true}
        unit: {type: string, description: 'Unit hiện dùng gồm hours và percent; không phải enum.'}
