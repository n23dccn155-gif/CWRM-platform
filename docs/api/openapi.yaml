openapi: 3.0.3
info:
  title: CWRM API
  version: 0.3.4-draft
  description: |
    REST contract CWRM MVP theo Scope v0.2 Final (14/11/2026) kèm Clarification FINAL-01..08 (PM duyệt 15/11/2026), thay cho Scope v0.1. Enum dùng UPPER_SNAKE_CASE; API dùng camelCase; DB dùng snake_case. Scope gồm S01–S12 và rule R01–R13. Rule Set v0.2 dùng ruleVersion 2.0.0; snapshot cũ giữ ruleVersion cũ.
    Manager và Member là hai quyền hệ thống. Main Role theo Team, Task Role theo Assignment, Skill do Member khai; các nhãn chuyên môn không cấp quyền. Task status, Assignment status, Request status, confirmation milestone và coverage là các trạng thái riêng. Mọi timestamp là UTC ISO-8601; ghi có expectedVersion; list dùng page/pageSize. Phong bì lỗi thống nhất { error: { code, message, details } }.

    x-permission là điều kiện truy cập theo quan hệ, không phải vai trò hệ thống mới. Guard backend kiểm tra trên mọi request; giá trị list nghĩa là thỏa một điều kiện.
    | x-permission | Điều kiện |
    |---|---|
    | PUBLIC | Không cần token. |
    | AUTHENTICATED | Có JWT hợp lệ. |
    | SELF | Chỉ tài nguyên thuộc caller trong JWT; không nhận userId để thao tác thay người khác. Với đường dẫn có workspaceId, caller không có membership ACTIVE nhận 404 NOT_FOUND. Lời mời của tài khoản khác trả 404 NOT_FOUND như lời mời không tồn tại. |
    | WORKSPACE_MEMBER | Membership ACTIVE trong workspace; Member chỉ nhận dữ liệu team được phép. Người gọi không có membership ACTIVE (kể cả INACTIVE) nhận 404 NOT_FOUND giống workspace không tồn tại, để không lộ ID. |
    | WORKSPACE_MANAGER | Manager ACTIVE trong workspace chứa tài nguyên. Không có membership ACTIVE trả 404 NOT_FOUND; Member ACTIVE nhìn thấy tài nguyên trả 403 FORBIDDEN. Với tài nguyên của team (/teams/{teamId}...), Member ACTIVE không phải thành viên ACTIVE của team đó nhận 404 NOT_FOUND như TEAM_ACCESS không đạt (C33-02.1). |
    | TEAM_ACCESS | Manager workspace chứa team hoặc thành viên ACTIVE của team. Không đạt trả 404 NOT_FOUND giống team không tồn tại. |
    | TASK_ACCESS | Manager workspace chứa task hoặc thành viên ACTIVE của team chứa task. Member ngoài team không gọi GET task. |
    | TASK_RESPONSIBLE | R có assignment ACCEPTED chưa kết thúc trên task. |
    | TASK_ACCOUNTABLE | A hiện hành của task. |
    | ASSIGNMENT_OWNER | Caller là chủ assignment ACCEPTED chưa kết thúc. |
    | AI_CHAT_ACCESS | Manager workspace chứa task hoặc R Accepted chưa kết thúc của task; thread luôn thuộc caller. Manager không đọc thread người khác. |

    Mã lỗi ổn định theo HTTP status:
    | HTTP | Mã | Ý nghĩa |
    |---|---|---|
    | 400 | VALIDATION_ERROR | Body, query hoặc path sai cấu trúc/miền. |
    | 401 | UNAUTHENTICATED | Thiếu JWT hoặc JWT không hợp lệ/hết hạn. |
    | 403 | FORBIDDEN | Nhìn thấy tài nguyên nhưng không có quyền thao tác. |
    | 404 | NOT_FOUND | Tài nguyên không tồn tại hoặc nằm ngoài phạm vi caller được phép thấy; không lộ tài nguyên có tồn tại hay không. |
    | 409 | VERSION_CONFLICT | expectedVersion cũ. |
    | 409 | CAPACITY_EXCEEDED | Thao tác đồng thời tranh chỗ hoặc vượt requiredPeople. |
    | 409 | UNIQUE_CONFLICT | Trùng dữ liệu duy nhất, gồm replacement đang chờ và tên Team/Role/Skill trùng trong cùng workspace (không phân biệt hoa thường). Xóa Role/Skill còn được tham chiếu trả details.reason=IN_USE kèm số tham chiếu. |
    | 409 | OPEN_WORK_TEMPORARILY_FULL | Hết suất tạm thời do lời mời chờ xác nhận. |
    | 409 | AI_TURN_IN_PROGRESS | Thread đang có lượt xử lý. |
    | 409 | AI_CONTEXT_CHANGED | Task version hoặc snapshot hiện hành đổi trong lúc provider xử lý. |
    | 422 | INVALID_STATE_TRANSITION | Trạng thái hiện tại không cho phép thao tác. |
    | 422 | OPEN_WORK_CLOSED | Open Work chưa mở hoặc đã đóng chính thức. |
    | 422 | PREDECESSOR_NOT_DONE | Chưa thể Start vì predecessor trực tiếp chưa Done. |
    | 422 | OPEN_BLOCKERS_EXIST | Không thể submit review hoặc unblock khi còn blocker OPEN. |
    | 422 | NO_ACCEPTED_RESPONSIBLE | Chưa có R Accepted hiệu lực. |
    | 422 | DEPENDENCY_CYCLE | Dependency tạo chu trình. |
    | 422 | CROSS_WORKSPACE_DEPENDENCY | Dependency không cùng workspace. |
    | 422 | MILESTONE_TEAM_MISMATCH | Milestone không thuộc cùng team với task. |
    | 422 | ACCOUNTABLE_NOT_MANAGER | A không phải Manager workspace hoặc không thuộc team. |
    | 422 | LAST_MANAGER_REQUIRED | Không thể gỡ, hạ quyền hoặc vô hiệu hóa Manager cuối. |
    | 422 | RESPONSIBILITY_REQUIRED | Thao tác sẽ làm mất A/R cần thiết. |
    | 422 | INVITEE_NOT_REGISTERED | Chỉ mời tài khoản đã đăng ký. |
    | 422 | ASSIGNMENT_CHANGE_NOT_ALLOWED_IN_REVIEW | Không thêm, thay hoặc duyệt rút R khi task REVIEW. |
    | 422 | PROGRESS_NOT_COMPLETE | Progress chưa bằng 100. |
    | 422 | RESPONSIBLE_CONFIRMATION_MISSING | Có R Accepted hiệu lực chưa xác nhận. |
    | 422 | EFFORT_ALLOCATION_EXCEEDED | Tổng effort allocation vượt Task estimate. |
    | 422 | WORK_UPDATE_DUPLICATE | Nội dung trùng Work Update gần nhất của tác giả trên task. |
    | 422 | AI_CONTEXT_UNAVAILABLE | Không dựng được context AI hợp lệ; provider không được gọi. |
    | 422 | FILTER_NOT_AVAILABLE | P-02/P-03 của 0.3.4-draft (EST-03; PM duyệt thiết kế 26/11/2026, chưa phát hành): `GET /tasks` hoặc `GET /dashboard/manager` có bộ lọc mà module nguồn chưa triển khai; details.unsupportedFilters liệt kê tên các bộ lọc đó, schema FilterNotAvailableError. |
    | 422 | RISK_INPUT_INVALID | Chỉ input bắt buộc thiếu hoặc sai miền, ví dụ deadline/progress; details là danh sách field/problem. Thiếu capacity hoặc remaining effort là gap trong snapshot PARTIAL, không phải lỗi input. |
    | 500 | INTERNAL_ERROR | Lỗi hệ thống không dự kiến. |
    | 502 | AI_PROVIDER_ERROR | Gemini/provider trả lỗi. |
    | 502 | AI_OUTPUT_INVALID | Output sai cấu trúc, số liệu hoặc evidence linkage. |
    | 503 | AI_TIMEOUT | Provider timeout. |
    | 503 | AI_QUOTA_EXCEEDED | Provider hết quota. |
    | 503 | RISK_EVALUATION_FAILED | Engine thất bại; không tạo snapshot LOW giả. |
    | 503 | SERVICE_UNAVAILABLE | GET /health không truy vấn được database. |

    Sau khi Gemini trả về, API kiểm lại quyền và context trước mọi nhánh lưu hoặc trả nội dung. Nếu quyền/context còn nguyên mà provider lỗi hoặc output sai, lỗi AI 502/503 lưu tin USER và ASSISTANT FAILED; details gồm retryable, messageId của tin FAILED và fallbackExplanation chỉ dựng từ evidence của snapshot hiện hành đã lọc theo người gọi (null nếu chưa có snapshot). Nếu quyền mất hoặc context đổi thì trả 403/409, không lưu tin nào của lượt đó và không kèm fallback. `RISK_INPUT_INVALID.details` là danh sách { field, problem }, không chứa stack trace.
servers:
  - url: http://localhost:3001/api/v1
    description: Máy phát triển mẫu; cổng sẽ chốt ở CWRM-12
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Kiểm tra tình trạng dịch vụ.
  - name: Auth
    description: 'S01: đăng ký, đăng nhập, đăng xuất và hồ sơ cơ bản.'
  - name: Workspace
    description: 'S01: workspace, membership MANAGER/MEMBER và lời mời trong ứng dụng.'
  - name: Team
    description: 'S02: team, Main Role theo team, danh mục Role/Skill và Member tự khai skill.'
  - name: Task
    description: 'S03, S06, S07, S09: task, checklist, milestone, review, blocker controls và dependency Finish-to-Start.'
  - name: Assignment
    description: 'S04, S05, S07: Direct Assignment, Open Work, replacement, withdrawal, effort và capacity.'
  - name: RACI
    description: 'S06: một A trên task, R suy ra từ assignment ACCEPTED hiệu lực, C/I tùy chọn.'
  - name: Progress
    description: 'S07, S08: progress, effort, checklist, blocker, Work Update và trao đổi.'
  - name: Capacity
    description: 'S07, S10: khai báo Member và duyệt capacity tuần.'
  - name: Risk
    description: 'S10: risk snapshot bất biến, evidence và đánh giá lại.'
  - name: Dashboard
    description: 'S11: dashboard Manager, My Work và cảnh báo trong ứng dụng.'
  - name: AI
    description: 'S12: chat nhiều lượt riêng tư theo user/task; chỉ giải thích và đề xuất.'
  - name: Audit
    description: 'S11: lịch sử thay đổi của task, chỉ đọc.'

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Kiểm tra tình trạng API
      description: Công khai, không cần token.
      x-permission: PUBLIC
      security: []
      responses:
        '200': {description: API đang hoạt động, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        '503': {description: 'Không truy vấn được database; dịch vụ tạm thời không sẵn sàng (503 SERVICE_UNAVAILABLE)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/register:
    post:
      operationId: registerAccount
      tags: [Auth]
      summary: Đăng ký tài khoản
      description: Công khai. Password chỉ nhận qua HTTPS và lưu dạng bcrypt hash; email phải duy nhất. Không xác minh email trong MVP.
      x-permission: PUBLIC
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}
      responses:
        '201': {description: Tài khoản được tạo, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Đăng nhập
      description: Công khai. Trả JWT Bearer access token; MVP không có refresh token.
      x-permission: PUBLIC
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        '200': {description: Đăng nhập thành công, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSession'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Kết thúc phiên ở client
      description: Quyền AUTHENTICATED. Không thu hồi JWT phía server; client xóa access token. Token hết hạn theo cấu hình.
      x-permission: AUTHENTICATED
      responses:
        '204': {description: Client có thể xóa token}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/me:
    get:
      operationId: getMyAccount
      tags: [Auth]
      summary: Xem hồ sơ hiện tại
      description: Quyền SELF; chỉ trả account của token hiện tại.
      x-permission: SELF
      responses:
        '200': {description: Hồ sơ, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    patch:
      operationId: updateMyAccount
      tags: [Auth]
      summary: Sửa tên hiển thị
      description: Quyền SELF; email không đổi qua thao tác này.
      x-permission: SELF
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfilePatchRequest'}}}}
      responses:
        '200': {description: Hồ sơ đã cập nhật, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /workspaces:
    get:
      operationId: listMyWorkspaces
      tags: [Workspace]
      summary: Liệt kê workspace của tôi
      description: Quyền AUTHENTICATED; chỉ workspace mà tài khoản hiện tại là thành viên.
      x-permission: AUTHENTICATED
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Danh sách phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspacePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    post:
      operationId: createWorkspace
      tags: [Workspace]
      summary: Tạo workspace
      description: Quyền AUTHENTICATED; người tạo trở thành MANAGER trong workspace mới.
      x-permission: AUTHENTICATED
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceCreateRequest'}}}}
      responses:
        '201': {description: Workspace mới, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /workspaces/{workspaceId}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      operationId: getWorkspace
      tags: [Workspace]
      summary: Xem workspace
      description: Quyền WORKSPACE_MEMBER; Manager trong workspace hoặc thành viên workspace. Người không có membership ACTIVE nhận 404 NOT_FOUND, cùng body với workspace không tồn tại.
      x-permission: WORKSPACE_MEMBER
      responses:
        '200': {description: Workspace, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    patch:
      operationId: updateWorkspace
      tags: [Workspace]
      summary: Sửa workspace
      description: Quyền WORKSPACE_MANAGER; chỉ sửa trường quản trị được phép. Member ACTIVE nhận 403 FORBIDDEN; người không có membership ACTIVE nhận 404 NOT_FOUND.
      x-permission: WORKSPACE_MANAGER
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspacePatchRequest'}}}}
      responses:
        '200': {description: Workspace đã sửa, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /workspaces/{workspaceId}/members:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PageSize'}
    get:
      operationId: listWorkspaceMembers
      tags: [Workspace]
      summary: Liệt kê thành viên workspace
      description: Quyền WORKSPACE_MANAGER; liệt kê membership và tập skill trong workspace. Main Role xem theo team qua GET /teams/{teamId}/members.
      x-permission: WORKSPACE_MANAGER
      responses:
        '200': {description: Membership phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/MembershipPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/UserId'}
    get:
      operationId: getWorkspaceMembership
      tags: [Workspace]
      summary: Xem membership và tập skill của một thành viên
      description: Quyền SELF hoặc WORKSPACE_MANAGER; MEMBER chỉ xem membership và tập skill của chính mình (kèm skillsVersion để gọi PUT my-skills), MANAGER xem mọi thành viên trong workspace.
      x-permission: [SELF, WORKSPACE_MANAGER]
      responses:
        '200': {description: Membership và tập skill, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceMembership'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    patch:
      operationId: updateWorkspaceMembership
      tags: [Workspace]
      summary: Đổi quyền hoặc trạng thái membership
      description: Quyền WORKSPACE_MANAGER; đổi Manager ACTIVE cuối thành MEMBER hoặc INACTIVE trả 422 LAST_MANAGER_REQUIRED, kể cả khi hai request chạy đồng thời. Hạ quyền hoặc vô hiệu hóa Manager đang là A của task chưa DONE trả 422 RESPONSIBILITY_REQUIRED; server không tự chuyển A, không kết thúc assignment. Chuyển INACTIVE thì mọi team membership của người đó trong workspace cũng chuyển INACTIVE, cùng transaction với audit (C33-02.2, C33-02.3). Gửi đúng role/status đang có là no-op, trả 200 và không ghi audit.
      x-permission: WORKSPACE_MANAGER
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MembershipPatchRequest'}}}}
      responses:
        '200': {description: Membership đã đổi, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceMembership'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    delete:
      operationId: removeWorkspaceMembership
      tags: [Workspace]
      summary: Gỡ thành viên workspace
      description: Quyền WORKSPACE_MANAGER; gỡ Manager ACTIVE cuối trả 422 LAST_MANAGER_REQUIRED, gỡ Manager đang là A của task chưa DONE trả 422 RESPONSIBILITY_REQUIRED. Membership workspace và mọi team membership của người đó trong workspace chuyển INACTIVE, cùng transaction với audit; lịch sử task, assignment, membership và audit được giữ, workspace khác không bị ảnh hưởng. Tham gia lại workspace (Accept lời mời mới) không tự khôi phục team cũ; Manager thêm lại team và đặt lại Main Role (C33-02.2). Guard R (không để task mất R Accepted cuối) áp dụng khi module assignment có dữ liệu (WP-024A/B, WP-026).
      x-permission: WORKSPACE_MANAGER
      responses:
        '204': {description: Membership đã gỡ}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /workspaces/{workspaceId}/invitations:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      operationId: listWorkspaceInvitations
      tags: [Workspace]
      summary: Liệt kê lời mời
      description: Quyền WORKSPACE_MANAGER; chỉ lời mời trong workspace này.
      x-permission: WORKSPACE_MANAGER
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Lời mời phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/InvitationPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    post:
      operationId: inviteWorkspaceMember
      tags: [Workspace]
      summary: Tạo lời mời trong ứng dụng
