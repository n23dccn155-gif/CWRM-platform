      description: |
        Quyền SELF; caller phải là thành viên ACTIVE của workspace. Thay toàn bộ tập skill của chính Member, không nhận userId và Manager không sửa thay. Task requiredSkillIds chỉ dùng để hiển thị mức phù hợp, không gate Open Work.
        Version thuộc cả tập skill (WorkspaceMembership.skillsVersion) và bắt đầu từ 1, kể cả khi Member chưa khai skill nào. skillIds rỗng là hợp lệ và xóa hết skill. skillIds có phần tử không thuộc workspace trả 400 VALIDATION_ERROR với details.unknownSkillIds, không ghi một phần (C33-01.3). expectedVersion khác version hiện tại trả 409 VERSION_CONFLICT, tập skill giữ nguyên. Gửi đúng tập đang có là no-op: trả 200 với version hiện tại, không tăng version. Mỗi lần tập skill thay đổi thật, version tăng đúng 1 trong cùng transaction với việc ghi member_skills.
