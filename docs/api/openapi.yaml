      description: Quyền WORKSPACE_MANAGER; không đổi role/eligibility của assignment đã nhận. Tên trùng với role khác trong cùng workspace (không phân biệt hoa thường) trả 409 UNIQUE_CONFLICT và giữ nguyên dữ liệu (C33-01.1).
      x-permission: WORKSPACE_MANAGER
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LabelPatchRequest'}}}}
