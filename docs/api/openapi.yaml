      operationId: removeTaskDependency
      tags: [Task]
      summary: Gỡ dependency
      description: Quyền WORKSPACE_MANAGER; chỉ sửa dependency khi successor còn TO_DO; lưu audit và reason. Cross-workspace trả 422 CROSS_WORKSPACE_DEPENDENCY.
      x-permission: WORKSPACE_MANAGER
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
      responses:
        '204': {description: Dependency đã gỡ}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /tasks/{taskId}/risk-snapshots/current:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
    get:
      operationId: getCurrentTaskRisk
      tags: [Risk]
      summary: Xem risk snapshot hiện hành
      description: |
        Quyền TASK_ACCESS; isCurrent=false khi dữ liệu task đã đổi sau snapshot hoặc lần đánh giá gần nhất lỗi, khi đó UI không trình bày snapshot như kết quả mới. Với MEMBER, evidence/gap về workload chỉ gồm dữ liệu của chính người gọi; phần của người khác chỉ còn số tổng hợp, không có user ID, task ID, tên hay nội dung nhận diện; Manager của workspace thấy đầy đủ. Không ai nhập hoặc sửa risk bằng tay.
      x-permission: TASK_ACCESS
      responses:
        '200':
          description: Snapshot gần nhất và trạng thái currentness
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentRisk'}
              examples:
                manager: {$ref: '#/components/examples/CurrentRiskManager'}
                member: {$ref: '#/components/examples/CurrentRiskMember'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /tasks/{taskId}/risk-snapshots:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
    get:
      operationId: listTaskRiskSnapshots
      tags: [Risk]
      summary: Xem lịch sử risk
      description: |
        Quyền TASK_ACCESS; snapshot bất biến, phân trang. Với MEMBER, evidence/gap về workload chỉ gồm dữ liệu của chính người gọi; phần của người khác chỉ còn số tổng hợp, không có user ID, task ID, tên hay nội dung nhận diện; Manager của workspace thấy đầy đủ.
      x-permission: TASK_ACCESS
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Lịch sử phân trang
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskSnapshotPage'}
              examples:
                manager: {$ref: '#/components/examples/RiskHistoryManager'}
                member: {$ref: '#/components/examples/RiskHistoryMember'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    post:
      operationId: evaluateTaskRisk
      tags: [Risk]
      summary: Manager yêu cầu đánh giá lại
      description: Quyền WORKSPACE_MANAGER; nguồn trigger MANUAL. Không nhận riskLevel, risk score, evaluatedAt hoặc thời gian đánh giá từ client.
      x-permission: WORKSPACE_MANAGER
      requestBody: {$ref: '#/components/requestBodies/EmptyOptional'}
      responses:
        '200': {description: Đánh giá thành công và snapshot mới, content: {application/json: {schema: {$ref: '#/components/schemas/RiskEvaluationResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/RiskInputInvalid'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        '503': {$ref: '#/components/responses/RiskUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /dashboard/manager:
    get:
      operationId: getManagerDashboard
      tags: [Dashboard]
      summary: Dashboard risk của Manager
      description: |
        Quyền WORKSPACE_MANAGER; trả số task theo status/risk/coverage, danh sách R quá tải theo mốc R09, milestone READY chờ xác nhận, withdrawal và capacity chờ duyệt cùng danh sách task. Lọc bằng teamId, status, priority, riskLevel, assignmentMode, openWorkState, deadline và A/R.
        Quy tắc P-03 của 0.3.4-draft (PM duyệt thiết kế ở CWRM-33 #10203, chưa phát hành) dùng chung nguyên tắc P-02 của listTasks: khi query có riskLevel, responsibleUserId hoặc openWorkState mà module nguồn chưa triển khai, cả request trả 422 FILTER_NOT_AVAILABLE, kể cả khi đi cùng bộ lọc đã hỗ trợ; details.unsupportedFilters liệt kê đúng các bộ lọc đó, sắp theo tên. Server không trả số đếm 0, risk LOW hay danh sách rỗng để che bộ lọc chưa hỗ trợ. Kiểm quyền WORKSPACE_MANAGER và validation query chạy trước: caller không đủ quyền vẫn nhận 401/403, giá trị query sai miền vẫn nhận 400. Bộ lọc đã hỗ trợ chạy trên dữ liệu thật và ngữ nghĩa các chỉ số giữ nguyên. Đây là đặc tả contract; dashboard được triển khai ở WP riêng, không thuộc WP-015A.
      x-permission: WORKSPACE_MANAGER
      parameters:
        - {$ref: '#/components/parameters/WorkspaceIdQuery'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: teamId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/TaskStatus'}}
        - {name: priority, in: query, schema: {$ref: '#/components/schemas/Priority'}}
        - {name: riskLevel, in: query, schema: {$ref: '#/components/schemas/RiskLevel'}}
        - {name: assignmentMode, in: query, schema: {type: string, enum: [DIRECT, OPEN_WORK]}}
        - {name: openWorkState, in: query, schema: {$ref: '#/components/schemas/OpenWorkState'}}
        - {name: accountableUserId, in: query, schema: {type: string, format: uuid}}
        - {name: responsibleUserId, in: query, schema: {type: string, format: uuid}}
        - {name: deadlineBefore, in: query, schema: {type: string, format: date-time}}
        - {name: deadlineAfter, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Dashboard phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/Dashboard'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/FilterNotAvailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /dashboard/my-work:
    get:
      operationId: getMyWorkDashboard
      tags: [Dashboard]
      summary: My Work
      description: Quyền WORKSPACE_MEMBER; trả danh sách phân trang, workload của tôi gồm capacity đã khai/duyệt và mốc R09 của caller, cùng task caller chưa xác nhận. `counts` là tổng số bản ghi của mỗi section trong workspace, không phụ thuộc trang hiện tại.
      x-permission: WORKSPACE_MEMBER
      parameters:
        - {$ref: '#/components/parameters/WorkspaceIdQuery'}
        - {name: myTasksPage, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: myTasksPageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: pendingDirectAssignmentsPage, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pendingDirectAssignmentsPageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: myOpenWorkRequestsPage, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: myOpenWorkRequestsPageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: My Work với từng section phân trang độc lập, content: {application/json: {schema: {$ref: '#/components/schemas/MyWorkDashboard'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /alerts:
    get:
      operationId: listMyAlerts
      tags: [Dashboard]
      summary: Liệt kê cảnh báo của tôi
      description: |
        Quyền SELF; chỉ trả alert của task caller có quyền, dù có cùng groupKey. Lọc theo type, groupKey, resolved, status, unread. readAt của recipient khác resolvedAt của alert. Với MEMBER, evidence/gap về workload chỉ gồm dữ liệu của chính người gọi; phần của người khác chỉ còn số tổng hợp, không có user ID, task ID, tên hay nội dung nhận diện; Manager của workspace thấy đầy đủ.
      x-permission: SELF
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: workspaceId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [OPEN, RESOLVED]}}
        - {name: unread, in: query, schema: {type: boolean}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/AlertType'}}
        - {name: groupKey, in: query, schema: {type: string}}
        - {name: resolved, in: query, schema: {type: boolean}}
      responses:
        '200': {description: Alert phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/AlertPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /alerts/{alertId}/read:
    parameters:
      - {$ref: '#/components/parameters/AlertId'}
    post:
      operationId: markAlertRead
      tags: [Dashboard]
      summary: Đánh dấu đã đọc
      description: Quyền SELF; người gọi phải là người nhận của cảnh báo. Cập nhật readAt của riêng người gọi, không resolve alert.
      x-permission: SELF
      responses:
        '200': {description: Trạng thái đọc của tôi, content: {application/json: {schema: {$ref: '#/components/schemas/AlertRecipient'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /tasks/{taskId}/checklists:
    parameters:
      - {$ref: '#/components/parameters/TaskId'}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PageSize'}
    get:
      operationId: listTaskChecklists
      tags: [Task]
      summary: Xem checklist nhóm theo từng R
      description: |
        Quyền TASK_ACCESS. Trả các checklist theo assignment/R cùng assignmentId và thông tin người phụ trách trong một response để UI không gọi N+1. A và R khác chỉ xem; chỉ ASSIGNMENT_OWNER được sửa checklist.
      x-permission: TASK_ACCESS
      responses:
        '200':
          description: Checklist nhóm theo assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistGroupPage'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /assignments/{assignmentId}/checklist-items:
    parameters:
      - {$ref: '#/components/parameters/AssignmentId'}
    post:
      operationId: createChecklistItem
      tags: [Task]
      summary: Thêm mục checklist cho assignment
      description: |
        Quyền ASSIGNMENT_OWNER. Chỉ khi task TO_DO, IN_PROGRESS hoặc BLOCKED. Checklist thuộc assignment, không có deadline/status/risk riêng và không đổi progress.
      x-permission: ASSIGNMENT_OWNER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemCreateRequest'
      responses:
        '201':
          description: Checklist item mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /checklist-items/{itemId}:
    parameters:
      - {$ref: '#/components/parameters/ChecklistItemId'}
    patch:
      operationId: updateChecklistItem
      tags: [Task]
      summary: Sửa mục checklist
      description: |
        Quyền ASSIGNMENT_OWNER. Chỉ khi task TO_DO, IN_PROGRESS hoặc BLOCKED. `expectedVersion` bắt buộc. Đổi `isDone` thật khi task IN_PROGRESS là hoạt động hợp lệ của đồng hồ R13; no-op không reset.
      x-permission: ASSIGNMENT_OWNER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemPatchRequest'
      responses:
        '200':
          description: Checklist item và version mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    delete:
      operationId: deleteChecklistItem
      tags: [Task]
      summary: Xóa mục checklist
      description: Quyền ASSIGNMENT_OWNER. Chỉ khi task TO_DO, IN_PROGRESS hoặc BLOCKED; task REVIEW/DONE chỉ đọc.
      x-permission: ASSIGNMENT_OWNER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemDeleteRequest'
      responses:
        '204': {description: Checklist item đã xóa}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /assignments/{assignmentId}/confirm:
    parameters:
      - {$ref: '#/components/parameters/AssignmentId'}
    post:
      operationId: confirmAssignmentWork
      tags: [RACI]
      summary: R xác nhận phần việc
      description: |
        Quyền ASSIGNMENT_OWNER; task phải IN_PROGRESS. Lưu assignments.confirmedAt; không đổi progress. Response có assignment, task và warnings; checklist chưa xong chỉ tạo warning, không chặn. Xác nhận thật reset đồng hồ R13.
      x-permission: ASSIGNMENT_OWNER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionActionRequest'
      responses:
        '200':
          description: Assignment, Task và cảnh báo không chặn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentConfirmationResult'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /assignments/{assignmentId}/unconfirm:
    parameters:
      - {$ref: '#/components/parameters/AssignmentId'}
    post:
      operationId: unconfirmAssignmentWork
      tags: [RACI]
      summary: Hủy xác nhận phần việc của tôi
      description: Quyền ASSIGNMENT_OWNER; chỉ khi task còn IN_PROGRESS. Gỡ confirmedAt của assignment caller; thao tác này không đổi progress.
      x-permission: ASSIGNMENT_OWNER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionActionRequest'
      responses:
        '200':
          description: Assignment và Task sau khi hủy xác nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentConfirmationResult'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /assignments/{assignmentId}/task-role:
    parameters:
      - {$ref: '#/components/parameters/AssignmentId'}
    patch:
      operationId: updateAssignmentTaskRole
      tags: [Assignment]
      summary: Đổi Task Role của assignment
      description: Quyền WORKSPACE_MANAGER. Gửi taskRoleId hoặc null, kèm reason và expectedVersion; chỉ task TO_DO/IN_PROGRESS/BLOCKED. Lưu lịch sử trong audit log.
      x-permission: WORKSPACE_MANAGER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRolePatchRequest'
      responses:
        '200':
          description: Assignment mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /assignments/{assignmentId}/effort-allocation:
    parameters:
      - {$ref: '#/components/parameters/AssignmentId'}
    patch:
      operationId: allocateAssignmentEffort
      tags: [Assignment]
      summary: Cấp effort estimate cho R
      description: Quyền WORKSPACE_MANAGER; estimateHours có thể là 0 hoặc null. expectedVersion bắt buộc; tổng estimate của R hiệu lực không vượt Task.effortEstimateHours, nếu vượt trả 422 EFFORT_ALLOCATION_EXCEEDED. Lưu before/after vào audit; không reset R13.
      x-permission: WORKSPACE_MANAGER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EffortAllocationRequest'
      responses:
        '200':
          description: Assignment sau cập nhật effort allocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
