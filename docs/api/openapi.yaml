    post:
      operationId: resolveBlocker
      tags: [Progress]
      summary: Giải quyết blocker
      description: |
        Quyền ASSIGNMENT_OWNER hoặc TASK_ACCOUNTABLE theo điều kiện sau.
        Khi assignment gắn với blocker còn ACCEPTED và còn hiệu lực (FINAL-06): chỉ R là chủ assignment đó được resolve blocker của chính mình; Manager, kể cả A, gọi thì trả 403 FORBIDDEN.
        Ngoại lệ có điều kiện của FINAL-06, PM-03 duyệt ngày 17/11/2026 (phương án B): khi assignment gắn với blocker đã kết thúc (rút được duyệt, bị thay hoặc Manager kết thúc) và blocker vẫn OPEN, chỉ người gọi đồng thời là Manager ACTIVE của workspace và là A hiện hành của task chứa blocker được resolve. Manager ACTIVE khác không phải A trả 403 FORBIDDEN. Nếu A hiện hành không còn hợp lệ hoặc không thể thực hiện, phải chuyển A qua POST /tasks/{taskId}/accountable (có audit) trước; quyền resolve không mở cho mọi Manager. Sau khi chuyển A, A mới được resolve và A cũ trả 403.
        Với ngoại lệ, resolutionNote là lý do bắt buộc, không rỗng; thiếu trả 400 VALIDATION_ERROR. Audit ghi actor, thời điểm server UTC, blocker, assignment, task và thay đổi trạng thái. Việc R rời task không được coi là bằng chứng blocker đã được xử lý; nếu nguyên nhân vẫn ảnh hưởng R mới, R mới báo blocker mới theo quyền của mình. Lịch sử blocker và assignment được giữ.
