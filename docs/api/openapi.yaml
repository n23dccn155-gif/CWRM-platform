      type: object
      required: [id, taskId, riskLevel, baseLevel, evaluatedAt, ruleVersion, triggeredRules, evidence, inputFingerprint, triggerSource]
      properties:
        id: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        riskLevel: {$ref: '#/components/schemas/RiskLevel'}
        baseLevel: {$ref: '#/components/schemas/RiskLevel'}
