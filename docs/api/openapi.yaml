openapi: 3.0.3
info:
  title: CWRM API
  version: 0.2.0-draft
  description: |
    REST contract CWRM MVP, phủ S01-S12. Enum dùng UPPER_SNAKE_CASE; UI tự ánh xạ sang nhãn.
    Manager và Member là hai quyền hệ thống; role/skill chuyên môn và RACI là các dữ liệu khác nhau. Các giá trị x-permission là điều kiện truy cập theo quan hệ, không phải vai trò hệ thống mới.
    Task status và assignment status không dùng chung. Task DONE và dữ liệu nghiệp vụ liên quan là chỉ đọc; status chỉ đổi qua action endpoint. Mọi timestamp là UTC ISO-8601; `RiskSnapshot.evaluatedAt` kết thúc bằng Z. `Task.risk` luôn có mặt, null khi chưa có snapshot hợp lệ; `CurrentRisk` khi đó không có `snapshot`. page/pageSize dùng cho list endpoint.

    x-permission ghi điều kiện truy cập của từng operation. Giá trị là một mã hoặc một danh sách mã; danh sách nghĩa là chỉ cần thỏa một điều kiện. Guard backend kiểm tra các điều kiện này trên mọi request.
    | x-permission | Điều kiện |
    |---|---|
    | PUBLIC | Không cần token |
    | AUTHENTICATED | Có JWT hợp lệ |
    | SELF | Tài nguyên thuộc về chính tài khoản trong JWT: hồ sơ, lời mời, assignment, request hoặc trạng thái đọc cảnh báo của mình. Không nhận userId từ client để thao tác thay người khác |
    | WORKSPACE_MEMBER | Membership ACTIVE trong workspace với quyền MANAGER hoặc MEMBER. Dữ liệu trả về được lọc theo team mà MEMBER thuộc |
    | WORKSPACE_MANAGER | Membership ACTIVE với quyền MANAGER trong workspace chứa tài nguyên |
    | TEAM_ACCESS | MANAGER của workspace chứa team, hoặc thành viên ACTIVE của team |
    | TASK_ACCESS | MANAGER của workspace chứa task, hoặc thành viên ACTIVE của team chứa task. Tương ứng dòng "Xem task và trao đổi" ở Scope 6.3 |
    | TASK_RESPONSIBLE | Người gọi là R: có assignment ACCEPTED chưa kết thúc trên task |
    | TASK_ACCOUNTABLE | Người gọi là A hiện hành của task |

    Phong bì lỗi thống nhất: { "error": { "code", "message", "details" } }.
    Mã lỗi ổn định theo HTTP status:
    | HTTP | Mã | Ý nghĩa |
    |---|---|---|
    | 400 | VALIDATION_ERROR | Body, query hoặc path sai cấu trúc/miền |
    | 401 | UNAUTHENTICATED | Thiếu hoặc JWT không hợp lệ/hết hạn |
    | 403 | FORBIDDEN | Không có quyền hoặc không thuộc workspace/team |
    | 404 | NOT_FOUND | Không tìm thấy tài nguyên trong phạm vi được phép |
    | 409 | VERSION_CONFLICT | expectedVersion cũ; tải lại trước khi sửa |
    | 409 | CAPACITY_EXCEEDED | Hết chỗ hoặc thao tác đồng thời tranh chỗ |
    | 409 | UNIQUE_CONFLICT | Trùng dữ liệu duy nhất |
    | 409 | SNAPSHOT_NOT_CURRENT | Snapshot không còn là snapshot hiện hành của task; tải snapshot mới rồi gọi lại |
    | 422 | INVALID_STATE_TRANSITION | Chuyển trạng thái không hợp lệ |
    | 422 | NOT_ELIGIBLE | Không đủ điều kiện Open Work; request không được tạo |
    | 422 | PREDECESSOR_NOT_DONE | Chưa thể Start vì predecessor trực tiếp chưa Done |
    | 422 | OPEN_BLOCKERS_EXIST | Không thể Review/Done khi còn blocker mở |
    | 422 | NO_ACCEPTED_RESPONSIBLE | Chưa có R Accepted hiệu lực |
    | 422 | DEPENDENCY_CYCLE | Dependency tạo chu trình |
    | 422 | CROSS_TEAM_DEPENDENCY | Dependency không cùng team |
    | 422 | ACCOUNTABLE_NOT_MANAGER | A không phải Manager workspace/không thuộc team |
    | 422 | LAST_MANAGER_REQUIRED | Không thể gỡ hoặc hạ Manager cuối |
    | 422 | RESPONSIBILITY_REQUIRED | Thao tác sẽ làm mất A/R cần thiết |
    | 422 | INVITEE_NOT_REGISTERED | Chỉ mời tài khoản đã đăng ký |
    | 422 | RISK_INPUT_INVALID | Risk input thiếu hoặc sai miền; details là danh sách { field, problem }; không tạo snapshot giả |
    | 422 | AI_SNAPSHOT_LEVEL_NOT_SUPPORTED | AI chỉ nhận snapshot Medium/High |
    | 500 | INTERNAL_ERROR | Lỗi hệ thống không dự kiến |
    | 502 | AI_PROVIDER_ERROR | Provider trả lỗi |
    | 502 | AI_OUTPUT_INVALID | Output thiếu trường hoặc evidence linkage sai |
    | 503 | AI_TIMEOUT | Provider timeout; giữ risk/evidence và cho thử lại |
    | 503 | AI_QUOTA_EXCEEDED | Hết quota; giữ risk/evidence và cho thử lại |
    | 503 | RISK_EVALUATION_FAILED | Không thể đánh giá risk; snapshot trước không được coi là hiện hành |
    | 503 | SERVICE_UNAVAILABLE | GET /health không truy vấn được database |

    `RISK_INPUT_INVALID.details` là danh sách `{ field, problem }`, không chứa stack trace. Lỗi AI (502, 503) trả thêm trong details: retryable, recommendationId của bản ghi FAILED đã lưu, snapshotId và fallbackExplanation dựng từ evidence đã lưu. Risk và evidence vẫn đọc được qua các endpoint Risk.
servers:
  - url: http://localhost:3001/api/v1
    description: Máy phát triển mẫu; cổng sẽ chốt ở CWRM-12
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Kiểm tra tình trạng dịch vụ.
  - name: Auth
    description: 'S01: đăng ký, đăng nhập, đăng xuất và hồ sơ cơ bản.'
  - name: Workspace
    description: 'S01: workspace, membership MANAGER/MEMBER và lời mời trong ứng dụng.'
  - name: Team
    description: 'S02: team, thành viên team, danh mục role/skill chuyên môn và nhãn gắn cho thành viên.'
  - name: Task
    description: 'S03, S06, S07, S09: task, milestone, chuyển trạng thái qua action endpoint (gồm review của A) và dependency Finish-to-Start.'
  - name: Assignment
    description: 'S04, S05: Direct Assignment, Open Work request, eligibility và số chỗ.'
  - name: RACI
    description: 'S06: một A trên task, R suy ra từ assignment ACCEPTED hiệu lực, C/I tùy chọn.'
  - name: Progress
    description: 'S07, S08: progress, effort, can thiệp quản lý, blocker và trao đổi.'
  - name: Risk
    description: 'S10: risk snapshot bất biến, evidence và đánh giá lại.'
  - name: Dashboard
    description: 'S11: dashboard Manager, My Work và cảnh báo trong ứng dụng.'
  - name: AI
    description: 'S12: giải thích và gợi ý của AI gắn với risk snapshot.'
  - name: Audit
    description: 'S11: lịch sử thay đổi của task, chỉ đọc.'

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Kiểm tra tình trạng API
      description: Công khai, không cần token.
      x-permission: PUBLIC
      security: []
      responses:
        '200': {description: API đang hoạt động, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        '503': {description: 'Không truy vấn được database; dịch vụ tạm thời không sẵn sàng (503 SERVICE_UNAVAILABLE)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/register:
    post:
      operationId: registerAccount
      tags: [Auth]
      summary: Đăng ký tài khoản
      description: Công khai. Password chỉ nhận qua HTTPS và lưu dạng bcrypt hash; email phải duy nhất. Không xác minh email trong MVP.
      x-permission: PUBLIC
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}
      responses:
        '201': {description: Tài khoản được tạo, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Đăng nhập
      description: Công khai. Trả JWT Bearer access token; MVP không có refresh token.
      x-permission: PUBLIC
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        '200': {description: Đăng nhập thành công, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSession'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Kết thúc phiên ở client
      description: Quyền AUTHENTICATED. Không thu hồi JWT phía server; client xóa access token. Token hết hạn theo cấu hình.
      x-permission: AUTHENTICATED
      responses:
        '204': {description: Client có thể xóa token}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/me:
    get:
      operationId: getMyAccount
      tags: [Auth]
      summary: Xem hồ sơ hiện tại
      description: Quyền SELF; chỉ trả account của token hiện tại.
      x-permission: SELF
      responses:
        '200': {description: Hồ sơ, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    patch:
      operationId: updateMyAccount
      tags: [Auth]
      summary: Sửa tên hiển thị
      description: Quyền SELF; email không đổi qua thao tác này.
      x-permission: SELF
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfilePatchRequest'}}}}
      responses:
        '200': {description: Hồ sơ đã cập nhật, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /workspaces:
    get:
      operationId: listMyWorkspaces
      tags: [Workspace]
      summary: Liệt kê workspace của tôi
      description: Quyền AUTHENTICATED; chỉ workspace mà tài khoản hiện tại là thành viên.
      x-permission: AUTHENTICATED
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Danh sách phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspacePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    post:
      operationId: createWorkspace
      tags: [Workspace]
      summary: Tạo workspace
      description: Quyền AUTHENTICATED; người tạo trở thành MANAGER trong workspace mới.
      x-permission: AUTHENTICATED
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceCreateRequest'}}}}
      responses:
        '201': {description: Workspace mới, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /workspaces/{workspaceId}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      operationId: getWorkspace
      tags: [Workspace]
      summary: Xem workspace
      description: Quyền WORKSPACE_MEMBER; Manager trong workspace hoặc thành viên workspace.
      x-permission: WORKSPACE_MEMBER
      responses:
        '200': {description: Workspace, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    patch:
      operationId: updateWorkspace
      tags: [Workspace]
      summary: Sửa workspace
      description: Quyền WORKSPACE_MANAGER; chỉ sửa trường quản trị được phép.
      x-permission: WORKSPACE_MANAGER
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspacePatchRequest'}}}}
      responses:
        '200': {description: Workspace đã sửa, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /workspaces/{workspaceId}/members:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PageSize'}
    get:
      operationId: listWorkspaceMembers
      tags: [Workspace]
      summary: Liệt kê thành viên workspace
      description: Quyền WORKSPACE_MANAGER; liệt kê membership và nhãn role/skill trong workspace.
      x-permission: WORKSPACE_MANAGER
      responses:
        '200': {description: Membership phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/MembershipPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/UserId'}
    get:
      operationId: getWorkspaceMembership
      tags: [Workspace]
      summary: Xem membership và nhãn role/skill của một thành viên
      description: Quyền SELF hoặc WORKSPACE_MANAGER; MEMBER chỉ xem membership và nhãn role/skill của chính mình, MANAGER xem mọi thành viên trong workspace.
      x-permission: [SELF, WORKSPACE_MANAGER]
      responses:
        '200': {description: Membership và danh sách nhãn, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceMembership'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    patch:
      operationId: updateWorkspaceMembership
      tags: [Workspace]
      summary: Đổi quyền hoặc trạng thái membership
      description: Quyền WORKSPACE_MANAGER; không hạ/gỡ Manager cuối và không làm mất A/R cần xử lý.
      x-permission: WORKSPACE_MANAGER
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MembershipPatchRequest'}}}}
      responses:
        '200': {description: Membership đã đổi, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceMembership'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    delete:
      operationId: removeWorkspaceMembership
      tags: [Workspace]
      summary: Gỡ thành viên workspace
      description: Quyền WORKSPACE_MANAGER; chỉ khi không còn trách nhiệm A/R cần xử lý và không gỡ Manager cuối. Membership chuyển INACTIVE, lịch sử được giữ.
      x-permission: WORKSPACE_MANAGER
      responses:
        '204': {description: Membership đã gỡ}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /workspaces/{workspaceId}/invitations:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      operationId: listWorkspaceInvitations
      tags: [Workspace]
      summary: Liệt kê lời mời
      description: Quyền WORKSPACE_MANAGER; chỉ lời mời trong workspace này.
      x-permission: WORKSPACE_MANAGER
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Lời mời phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/InvitationPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    post:
      operationId: inviteWorkspaceMember
      tags: [Workspace]
      summary: Tạo lời mời trong ứng dụng
      description: Quyền WORKSPACE_MANAGER; email phải thuộc tài khoản đã đăng ký. Không gửi email.
      x-permission: WORKSPACE_MANAGER
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InvitationCreateRequest'}}}}
      responses:
        '201': {description: Invitation PENDING, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceInvitation'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /workspace-invitations:
    get:
      operationId: listMyWorkspaceInvitations
      tags: [Workspace]
      summary: Liệt kê lời mời gửi tới tôi
      description: Quyền SELF; chỉ trả lời mời của account trong JWT, không gửi email.
      x-permission: SELF
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Lời mời phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/InvitationPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /workspace-invitations/{invitationId}/accept:
    parameters:
      - {$ref: '#/components/parameters/InvitationId'}
    post:
      operationId: acceptWorkspaceInvitation
      tags: [Workspace]
      summary: Chấp nhận lời mời
      description: Quyền SELF; chỉ tài khoản được mời mới được Accept.
      x-permission: SELF
      responses:
        '200': {description: Membership đã tham gia, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceMembership'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /workspace-invitations/{invitationId}/decline:
    parameters:
      - {$ref: '#/components/parameters/InvitationId'}
    post:
      operationId: declineWorkspaceInvitation
      tags: [Workspace]
      summary: Từ chối lời mời
      description: Quyền SELF; chỉ tài khoản được mời mới được Decline.
      x-permission: SELF
      responses:
        '200': {description: Invitation DECLINED, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceInvitation'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /workspaces/{workspaceId}/teams:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
    get:
      operationId: listTeams
      tags: [Team]
      summary: Liệt kê team
      description: Quyền WORKSPACE_MEMBER; Manager xem mọi team, Member chỉ team mình thuộc.
      x-permission: WORKSPACE_MEMBER
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Team phân trang, content: {application/json: {schema: {$ref: '#/components/schemas/TeamPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
