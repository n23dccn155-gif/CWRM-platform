    FilterNotAvailableError:
      description: Phong bì lỗi thống nhất của ErrorResponse, siết riêng cho 422 FILTER_NOT_AVAILABLE (P-02/P-03). details chỉ có unsupportedFilters, gồm ít nhất một tên bộ lọc, không trùng, sắp theo tên. Thứ tự sắp không diễn đạt được bằng schema nên là quy tắc của operation và là ca QA.
      allOf:
        - {$ref: '#/components/schemas/ErrorResponse'}
        - type: object
          required: [error]
          properties:
            error:
              type: object
              required: [code, details]
              properties:
                code: {type: string, enum: [FILTER_NOT_AVAILABLE]}
                message: {type: string}
                details:
                  type: object
                  required: [unsupportedFilters]
                  additionalProperties: false
                  properties:
                    unsupportedFilters:
                      type: array
                      minItems: 1
                      uniqueItems: true
                      items: {type: string, enum: [openWorkState, responsibleUserId, riskLevel]}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VERSION_CONFLICT, CAPACITY_EXCEEDED, UNIQUE_CONFLICT, OPEN_WORK_TEMPORARILY_FULL, AI_TURN_IN_PROGRESS, AI_CONTEXT_CHANGED, INVALID_STATE_TRANSITION, OPEN_WORK_CLOSED, PREDECESSOR_NOT_DONE, OPEN_BLOCKERS_EXIST, NO_ACCEPTED_RESPONSIBLE, DEPENDENCY_CYCLE, CROSS_WORKSPACE_DEPENDENCY, MILESTONE_TEAM_MISMATCH, ACCOUNTABLE_NOT_MANAGER, LAST_MANAGER_REQUIRED, RESPONSIBILITY_REQUIRED, INVITEE_NOT_REGISTERED, ASSIGNMENT_CHANGE_NOT_ALLOWED_IN_REVIEW, PROGRESS_NOT_COMPLETE, RESPONSIBLE_CONFIRMATION_MISSING, EFFORT_ALLOCATION_EXCEEDED, WORK_UPDATE_DUPLICATE, AI_CONTEXT_UNAVAILABLE, FILTER_NOT_AVAILABLE, RISK_INPUT_INVALID, RISK_EVALUATION_FAILED, AI_PROVIDER_ERROR, AI_OUTPUT_INVALID, AI_TIMEOUT, AI_QUOTA_EXCEEDED, SERVICE_UNAVAILABLE, INTERNAL_ERROR]
            message: {type: string}
            details:
              oneOf:
                - type: object
                  additionalProperties: true
                  properties:
                    fallbackExplanation: {type: string, nullable: true}
                - type: array
                  items:
                    type: object
                    required: [field, problem]
                    properties:
                      field: {type: string}
                      problem: {type: string}
      example:
        error:
          code: OPEN_WORK_TEMPORARILY_FULL
          message: Hết suất tạm thời do lời mời chờ xác nhận
          details: {}
